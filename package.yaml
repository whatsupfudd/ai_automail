name:                automail
version:             0.1.0.0
github:              "githubuser/automail"
license:             BSD3
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2026 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/automail#readme>

dependencies:
  - aeson
  - base >= 4.7 && < 5
  - bytestring
  - containers
  - directory
  - hashable
  - scientific
  - text
  - time
  - vector
  # For YAML (config file):
  - yaml
  - directory
  - filepath
  # For Git (version):
  - gitrev
  # For options:
  - optparse-applicative
  - unix
  # For Cont(T):
  - mtl
  - transformers
  # For SQL:
  - postgresql-binary
  - hasql
  - hasql-th
  - hasql-pool
  - hasql-transaction
  - profunctors
  # For Cors:
  - case-insensitive
  # For HTTP:
  - http-types
  - wai
  - wai-cors
  - wai-extra
  - warp
  # For Servant:
  - servant
  - servant-server
  - servant-client
  - servant-auth
  - servant-auth-server
  - servant-multipart
  # Concurrency:
  - stm
  - async
  # Crypto:
  - crypton
  - memory
  - base64-bytestring


default-extensions:
- OverloadedStrings
- DuplicateRecordFields
- OverloadedRecordDot

ghc-options:
# - -Wall
# - -Wunused-matches
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
#- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  automail:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - automail

tests:
  automail-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - automail
